[general]
framerate = 30
bars = 64
autosens = 1

[input]
method = fifo
source = /dev/stdin
sample_rate = 44100
sample_bits = 16
channels = 2

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
channels = stereo
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 65
