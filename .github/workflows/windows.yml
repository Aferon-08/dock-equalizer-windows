name: Windows x64
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_VERSION: '6.8.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true
      - name: Prepare bundled CPython
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'python-3.12.10.zip'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/python/3.12.10/python.3.12.10.nupkg' -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '0eb85c2dfccccf1b17352de4c397f69194035b7d37149eacc16f1147d93de3b8') { throw 'CPython archive checksum mismatch' }
          $runtime = Join-Path $env:RUNNER_TEMP 'cpython'
          Expand-Archive $archive $runtime
          "SOUNDBAR_PYTHON=$(Join-Path $runtime tools)" >> $env:GITHUB_ENV
      - name: Build and test
        shell: pwsh
        run: |
          cmake --preset windows-msvc-x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DSOUNDBAR_ALIGNMENT_PYTHON=$env:SOUNDBAR_PYTHON"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-msvc-x64 --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset windows-msvc-x64 --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install out/build/windows-msvc-x64 --config Release
      - name: Make ZIP and installer
        shell: pwsh
        run: |
          choco install nsis --version=3.11 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $makeappx = Get-ChildItem $sdkBin -Filter MakeAppx.exe -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$makeappx) { throw 'MakeAppx.exe was not found in the Windows SDK' }
          $notices = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'qt-sources')
          foreach ($module in 'qtbase', 'qtdeclarative', 'qtsvg') {
            $name = "$module-$env:QT_VERSION.tar.gz"
            Invoke-WebRequest "https://codeload.github.com/qt/$module/tar.gz/refs/tags/v$env:QT_VERSION" -OutFile (Join-Path $notices $name)
          }
          python windows/package.py --stage out/stage/windows-msvc-x64 --out dist --makensis $compiler --makeappx $makeappx.FullName --qt-archives $notices
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git archive --format=zip --prefix=SekaiSoundbar-source/ --output=dist/SekaiSoundbar-source.zip HEAD
      - name: Test portable and installed copies without Qt on PATH
        shell: pwsh
        run: ./windows/tests/PackagedSmokeTest.ps1 -Dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: SekaiSoundbar-Windows11-x64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
