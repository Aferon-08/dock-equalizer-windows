name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pure-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m compileall -q .
      - name: Manifest
        run: python -c "import json; p=json.load(open('plugin.json')); assert p['id']=='dock-equalizer' and p['api']==1"
      - name: Integrated music palette sessions
        run: |
          python -m pip install Pillow
          python tests/music-palette.py
          python tests/palette-context.py
      - name: Browser duration recovery
        run: node tests/duration-cache.mjs
      - name: Spectrum gain and time-based smoothing
        run: node tests/spectrum-envelope.mjs
      - name: Beat grid and heartbeat motion
        run: node tests/rhythm.mjs
      - name: Playback position and epoch boundaries
        run: node tests/position-clock.mjs
      - name: Analysis completeness and fingerprint
        run: |
          node tests/analysis-policy.mjs
          python tests/analysis-identity.py
      - name: Worker bundle
        run: python build-pet-worker.py --check
      - name: Tube, independent twins and reunion
        run: node tests/tube-and-family.mjs
      - name: Independent bubble carriers and plastic wall
        run: node tests/bubble-family.mjs
      - name: Settings liquid transition geometry
        run: node tests/settings-motion.mjs
      - name: Settings presets, dependency keys and profile compatibility
        run: node tests/settings-profiles.mjs
      - name: Native installation has no patching side effects
        run: python tests/installer.py
      - name: Cached lyric finale
        run: node tests/finale-cache.mjs
      - name: Dock glass controls and retained customization
        run: node tests/dock-material.mjs
      - uses: actions/checkout@v4
        with:
          repository: Blapples/SekaiPop
          ref: e629dfed4781ecc5bf7eeecad28787462dc1e114
          path: upstream-shell
      - name: Proposed API patch applies to pinned shell
        run: git -C upstream-shell apply --check "$GITHUB_WORKSPACE/integration/sekaipop-native-extensions.patch"
      - name: Native API and legacy manifest compatibility
        run: |
          git -C upstream-shell apply "$GITHUB_WORKSPACE/integration/sekaipop-native-extensions.patch"
          node tests/native-api.mjs upstream-shell/sekaipop/modules/common/functions/PluginManifest.js
          node tests/extension-providers.mjs upstream-shell/sekaipop
